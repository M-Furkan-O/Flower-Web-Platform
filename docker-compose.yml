version: '3.8'

services:
  db:
    image: postgis/postgis:15-3.4
    container_name: flower_shop_db
    environment:
      POSTGRES_USER: shopadmin
      POSTGRES_PASSWORD: shoppassword123
      POSTGRES_DB: FlowerShopDb
    ports:
      - "5432:5432"
    volumes:
      - flower_pgdata:/var/lib/postgresql/data
    restart: always

  redis:
    image: redis:alpine
    container_name: flower_shop_redis
    ports:
      - "6379:6379"
    restart: always

volumes:
  flower_pgdata: